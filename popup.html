<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>WeebCentral Downloader</title>
  <link rel="stylesheet" href="styles.css">
  <script src="jszip.min.js" defer></script>
  <script src="jspdf.min.js" defer></script>
  <script src="manga-scraper.js" defer></script>
  <script type="module" src="popup.js" defer></script>
</head>

<body>
  <header>
    <h2>WeebCentral</h2>
  </header>

  <div class="tabs-nav">
    <button class="tab-btn active" data-tab="chapters">Chapters</button>
    <button class="tab-btn" data-tab="settings">Settings</button>
  </div>

  <div class="tab-content">
    <!-- Chapters Tab -->
    <div id="tab-chapters" class="tab-pane active">
      <div class="card">
        <div class="input-group">
          <label for="chapterRange">Select Range</label>
          <input type="text" id="chapterRange" placeholder="e.g. 1-10, 5, or empty for all">
        </div>
        <!-- Auto-fetching enabled -->
      </div>

      <div id="chaptersContainer"
        style="display: none; height: 100%; display: flex; flex-direction: column; overflow: hidden;">
        <div class="action-row" style="margin: 10px 0;">
          <button id="selectAll" class="btn-secondary" style="padding: 6px; font-size: 12px;">All</button>
          <button id="deselectAll" class="btn-secondary" style="padding: 6px; font-size: 12px;">None</button>
        </div>
        <div id="chaptersList" class="chapters-list"></div>
        <button id="downloadSelected" class="btn-primary" style="margin-top: 10px;">
          Download Selected
        </button>
      </div>

      <div id="empty-state" style="text-align: center; color: var(--text-secondary); margin-top: 40px;">
        <p>Navigate to a manga page to start.</p>
      </div>
    </div>

    <!-- Settings Tab -->
    <div id="tab-settings" class="tab-pane">
      <div class="card">
        <div class="input-group">
          <label for="downloadFormat">Download Format</label>
          <select id="downloadFormat">
            <option value="images">Images (Folder)</option>
            <option value="zip">ZIP Archive</option>
            <option value="pdf">PDF Document</option>
          </select>
        </div>

        <div class="input-group">
          <label for="imageConcurrency">Image Concurrency (Parallel Images)</label>
          <input type="number" id="imageConcurrency" min="1" max="10" step="1">
        </div>

        <div class="input-group">
          <label for="chapterConcurrency">Chapter Concurrency (Parallel Chapters)</label>
          <input type="number" id="chapterConcurrency" min="1" max="5" step="1">
        </div>

        <div class="input-group">
          <label for="downloadDelay">Download Delay (ms)</label>
          <input type="number" id="downloadDelay" min="0" max="5000" step="100">
        </div>

        <button id="saveSettings" class="btn-primary" style="margin-top: 10px;">Save Configuration</button>
      </div>

      <div style="text-align: center; margin-top: 30px; opacity: 0.3;">
        <small>WeebCentral Extension v1.0</small>
      </div>
    </div>
  </div>

  <!-- Persistent Status Bar -->
  <div id="status-area">
    <div id="status" class="status-text">Ready</div>
    <div class="progress-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
  </div>

</body>

</html>
